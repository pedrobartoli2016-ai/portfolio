  <!-- INTERACTIVIDAD DE LA RONDA -->
  <script>

    const apps = document.querySelectorAll(".spec-app");

    const nombre = document.getElementById("spec-nombre");
    const categoria = document.getElementById("spec-categoria");
    const descripcion = document.getElementById("spec-descripcion");

    // ESTADO PREDETERMINADO
    function mostrarDefault() {

      nombre.textContent = "SOFTWARE";
      categoria.textContent = "";
      descripcion.textContent = "";

      apps.forEach(app => {
        app.classList.remove("activa");
        app.setAttribute("aria-pressed", "false");
      });

    }

    // MOSTRAR INFORMACIÓN DE UNA APLICACIÓN
    function mostrarApp(app) {

      apps.forEach(item => {
        item.classList.remove("activa");
        item.setAttribute("aria-pressed", "false");
      });

      app.classList.add("activa");
      app.setAttribute("aria-pressed", "true");

      nombre.textContent = app.dataset.nombre;
      categoria.textContent = app.dataset.categoria;
      descripcion.textContent = app.dataset.descripcion;

    }

    // EVENTOS DE CADA APLICACIÓN
    apps.forEach(app => {

      app.setAttribute("aria-pressed", "false");

      // PASAR EL MOUSE
      app.addEventListener("mouseenter", () => {
        mostrarApp(app);
      });

      // RETIRAR EL MOUSE
      app.addEventListener("mouseleave", () => {
        if (document.activeElement !== app) {
          mostrarDefault();
        }
      });

      // NAVEGACIÓN CON TECLADO
      app.addEventListener("focus", () => {
        mostrarApp(app);
      });

      app.addEventListener("blur", () => {
        mostrarDefault();
      });

      // CLICK O TOQUE EN CELULAR
      app.addEventListener("click", () => {
        mostrarApp(app);

        if (window.matchMedia("(hover: hover)").matches) {
          app.blur();
        }
      });

    });

    // AL CARGAR LA PÁGINA
    mostrarDefault();

  </script>

  <script src="moco.js" defer></script>

</body>
